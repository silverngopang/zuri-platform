services:
  backend:
    image: silverspark/zuriapp-backend:latest
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - STORE_NAME=Zuri Market
      - API_SECRET_KEY=__API_SECRET_KEY__
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/store"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: silverspark/zuriapp-frontend:latest
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
