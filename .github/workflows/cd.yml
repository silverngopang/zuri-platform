name: CD — Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Push compose file to SSM Parameter Store
        run: |
          COMPOSE=$(cat docker/docker-compose.ec2.yml | sed "s|__API_SECRET_KEY__|${{ secrets.API_SECRET_KEY }}|g")
          aws ssm put-parameter \
            --region us-east-2 \
            --name "/zuri/dev/docker-compose" \
            --value "$COMPOSE" \
            --type String \
            --overwrite

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids i-07efd01962f560eb4 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /opt/zuri",
              "aws ssm get-parameter --region us-east-2 --name /zuri/dev/docker-compose --query Parameter.Value --output text > /opt/zuri/docker-compose.yml",
              "docker compose -f /opt/zuri/docker-compose.yml pull",
              "docker compose -f /opt/zuri/docker-compose.yml up -d",
              "docker compose -f /opt/zuri/docker-compose.yml ps"
            ]' \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $COMMAND_ID"
          sleep 60
          aws ssm get-command-invocation \
            --region us-east-2 \
            --command-id $COMMAND_ID \
            --instance-id i-07efd01962f560eb4 \
            --query "[Status,StandardOutputContent,StandardErrorContent]" \
            --output text
