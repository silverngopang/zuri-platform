name: CD — Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --region us-east-2 \
            --instance-ids i-07efd01962f560eb4 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /opt/zuri",
              "cd /opt/zuri",
              "cat > /opt/zuri/docker-compose.yml << '"'"'EOF'"'"'\nservices:\n  backend:\n    image: silverspark/zuriapp-backend:latest\n    ports:\n      - \"5000:5000\"\n    environment:\n      - PORT=5000\n      - STORE_NAME=Zuri Market\n      - API_SECRET_KEY=${{ secrets.API_SECRET_KEY }}\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"wget\", \"-qO-\", \"http://localhost:5000/api/store\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n  frontend:\n    image: silverspark/zuriapp-frontend:latest\n    ports:\n      - \"80:80\"\n    depends_on:\n      backend:\n        condition: service_healthy\n    restart: unless-stopped\nEOF",
              "docker compose -f /opt/zuri/docker-compose.yml pull",
              "docker compose -f /opt/zuri/docker-compose.yml up -d",
              "docker compose -f /opt/zuri/docker-compose.yml ps"
            ]' \
            --output text \
            --query "Command.CommandId" > /tmp/command_id.txt
          echo "Command ID: $(cat /tmp/command_id.txt)"
          sleep 30
          aws ssm get-command-invocation \
            --region us-east-2 \
            --command-id $(cat /tmp/command_id.txt) \
            --instance-id i-07efd01962f560eb4 \
            --query "[Status,StandardOutputContent,StandardErrorContent]" \
            --output text
